# ==========================================
# 基礎設定（所有環境共用）
# ==========================================

server:
  port: 8888
  servlet:
    context-path: /eshop

spring:
  application:
    name: eshop

  profiles:
    active: dev

  # 共用的資料庫與連線預設值（供測試或未指定環境時使用）
  datasource:
    url: jdbc:postgresql://localhost:5432/eshopdb
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: Fr1597530

  # 共用的 Thymeleaf 樣板引擎設定
  thymeleaf:
    cache: false
    encoding: UTF-8
    mode: HTML

  # 共用的 JPA 基礎屬性與 Hibernate 方言
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
          time_zone: UTC


# ==========================================
# MyBatis
# ==========================================

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.eshop.entity

  configuration:
    map-underscore-to-camel-case: true


---
# ==========================================
# 1. 開發環境設定 (Development)
# ==========================================

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/eshopdb
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: Fr1597530

  jpa:
    hibernate:
      ddl-auto: update        # 自動更新資料表結構

server:
  port: 8080            # 開發環境使用 8080

logging:
  level:
    com.example.eshop: DEBUG   # 開發環境使用 DEBUG 層級


---
# ==========================================
# 2. 正式部署環境設定 (Production)
# ==========================================

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://localhost:5432/eshopdb
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: Fr1597530  # 正式環境建議使用高強度密碼

  jpa:
    hibernate:
      ddl-auto: update       # 正式環境嚴禁自動改表，僅驗證結構

    show-sql: false     # 關閉 SQL 顯示，確保資安與效能

server:
  port: 8888     # 正式環境使用 8888

logging:
  level:
    com.example.eshop: INFO   # 正式環境使用 INFO 層級